spring.application.name=campusbite

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/campusbite_db}
spring.datasource.username=${DB_USERNAME:prince}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

campusbite.jwt-secret=${JWT_SECRET:}
campusbite.admin-email=${ADMIN_EMAIL:}
campusbite.admin-password=${ADMIN_PASSWORD:}
campusbite.admin-name=${ADMIN_NAME:Canteen Admin}
campusbite.admin-phone=${ADMIN_PHONE:}
campusbite.razorpay-key-id=${RAZORPAY_KEY_ID:}
campusbite.razorpay-key-secret=${RAZORPAY_KEY_SECRET:}
campusbite.razorpay-webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
campusbite.mail-from=${CAMPUSBITE_MAIL_FROM:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
